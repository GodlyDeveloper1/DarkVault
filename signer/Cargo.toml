[package]
name = "vault-signer"
version = "0.1.0"
edition = "2021"

# Versions of the zcash_* crates match those already in Cargo.lock and in ECC's
# zcash-devtool, which was verified against testnet on 2026-09-30.
[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bip39 = "*"
getrandom = "0.2"
rand = "0.8"
rusqlite = { version = "0.37", features = ["array"] }
secrecy = "0.8"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }

zcash_client_backend = { version = "0.24", features = [
    "sync",
    "orchard",
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
] }
zcash_client_sqlite = "0.22"   # default features: orchard, multicore
zcash_address = "0.13"
zcash_primitives = "0.30"
zcash_proofs = { version = "0.30", features = ["bundled-prover"] }
zip321 = "0.9"
zcash_keys = { version = "0.16.1", features = ["orchard", "sapling"] }
zcash_protocol = "0.10"
zip32 = "=0.2.1"               # must match the zip32 used by zcash_keys
